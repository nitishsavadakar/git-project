<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My name is Nitish/title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0d17;
      --text: #f2f3f8;
      --muted: #8b90a8;
      --a: #ff6b6b;
      --b: #ffd166;
      --c: #4ecdc4;
      --d: #7b5cff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: "Space Grotesk", sans-serif;
      overflow: hidden;
    }

    /* Moving colour blobs in the background */
    .blob {
      position: fixed;
      width: 420px; height: 420px;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.45;
      animation: float 14s ease-in-out infinite alternate;
    }
    .blob.one   { background: var(--d); top: -120px; left: -100px; }
    .blob.two   { background: var(--c); bottom: -140px; right: -80px; animation-delay: -5s; }
    .blob.three { background: var(--a); top: 40%; left: 55%; width: 300px; height: 300px; animation-delay: -9s; }
    @keyframes float {
      to { transform: translate(80px, 60px) scale(1.15); }
    }

    /* Frosted glass card */
    .card {
      position: relative;
      text-align: center;
      padding: 56px 64px;
      margin: 16px;
      border-radius: 28px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.14);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 30px 80px rgba(0,0,0,0.45);
      animation: rise 0.9s cubic-bezier(.2,.8,.2,1) both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(40px) scale(0.96); }
    }

    .tag {
      display: inline-block;
      font-family: "JetBrains Mono", monospace;
      font-size: 13px;
      color: var(--c);
      border: 1px solid rgba(78,205,196,0.4);
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 26px;
    }

    h1 {
      font-size: clamp(48px, 11vw, 112px);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.04em;
      background: linear-gradient(90deg, var(--a), var(--b), var(--c), var(--d), var(--a));
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shine 6s linear infinite;
    }
    @keyframes shine { to { background-position: 300% 0; } }

    .wave { display: inline-block; animation: wave 2.2s ease-in-out infinite; transform-origin: 70% 70%; }
    @keyframes wave {
      0%, 60%, 100% { transform: rotate(0); }
      10%, 30% { transform: rotate(14deg); }
      20% { transform: rotate(-8deg); }
      40% { transform: rotate(-4deg); }
      50% { transform: rotate(10deg); }
    }

    p {
      margin-top: 20px;
      color: var(--muted);
      font-size: 18px;
    }

    .typed {
      margin-top: 30px;
      font-family: "JetBrains Mono", monospace;
      font-size: 15px;
      color: var(--b);
      min-height: 22px;
    }
    .typed::after {
      content: "▋";
      margin-left: 2px;
      animation: blink 1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    button {
      margin-top: 32px;
      font: inherit;
      font-weight: 700;
      color: var(--bg);
      background: linear-gradient(90deg, var(--c), var(--d));
      border: 0;
      padding: 14px 30px;
      border-radius: 14px;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
    }
    button:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(123,92,255,0.45); }
    button:active { transform: translateY(0); }

    /* Confetti pieces */
    .confetti {
      position: fixed;
      top: -20px;
      width: 10px; height: 14px;
      border-radius: 2px;
      pointer-events: none;
      animation: fall linear forwards;
    }
    @keyframes fall {
      to { transform: translateY(110vh) rotate(720deg); }
    }

    @media (max-width: 520px) {
      .card { padding: 40px 24px; }
    }
  </style>
</head>
<body>
  <div class="blob one"></div>
  <div class="blob two"></div>
  <div class="blob three"></div>

  <main class="card">
    <span class="tag">git commit -m "hello world"</span>
    <h1>My name is Nitish</h1>
    <p><span class="wave">👋</span> Welcome to my first Git project</p>
    <div class="typed" id="typed"></div>
    <button id="party">Celebrate 🎉</button>
  </main>

  <script>
    // Typewriter effect: types each Git command, deletes it, moves to the next
    const lines = [
      "git init",
      "git add index.html",
      "git commit -m \"Hello World\"",
      "git push origin main"
    ];
    const el = document.getElementById("typed");
    let line = 0, char = 0, deleting = false;

    function type() {
      const text = lines[line];
      el.textContent = text.slice(0, char);
      if (!deleting && char < text.length) { char++; setTimeout(type, 70); }
      else if (!deleting) { deleting = true; setTimeout(type, 1400); }
      else if (char > 0) { char--; setTimeout(type, 35); }
      else { deleting = false; line = (line + 1) % lines.length; setTimeout(type, 300); }
    }
    type();

    // Confetti burst when the button is clicked
    const colors = ["#ff6b6b", "#ffd166", "#4ecdc4", "#7b5cff", "#f2f3f8"];
    document.getElementById("party").addEventListener("click", () => {
      for (let i = 0; i < 120; i++) {
        const c = document.createElement("div");
        c.className = "confetti";
        c.style.left = Math.random() * 100 + "vw";
        c.style.background = colors[Math.floor(Math.random() * colors.length)];
        c.style.animationDuration = 2 + Math.random() * 2.5 + "s";
        c.style.animationDelay = Math.random() * 0.4 + "s";
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 5000);
      }
    });
  </script>
</body>
</html>
