<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Nitish</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="blob one"></div>
  <div class="blob two"></div>
  <div class="blob three"></div>

  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html" class="active">Contact</a>
  </nav>

  <main class="card">
    <span class="tag">git remote -v</span>
    <h1>Get in touch</h1>
    <p>Want to talk about data, machine learning or this project? Send me a message.</p>

    <div class="links">
      <a href="https://github.com/nitishsavadakar" target="_blank">GitHub ↗</a>
    </div>

    <form id="contact-form">
      <label>Your name
        <input type="text" id="name" required>
      </label>
      <label>Your email
        <input type="email" id="email" required>
      </label>
      <label>Message
        <textarea id="message" required></textarea>
      </label>
      <button type="submit">Send message ✉️</button>
      <div class="note" id="note"></div>
    </form>
  </main>

  <script>
    // Demo only: nothing is sent anywhere, it just shows a thank-you note
    document.getElementById("contact-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const name = document.getElementById("name").value;
      document.getElementById("note").textContent = "Thanks, " + name + "! (Demo form: nothing was actually sent.)";
      e.target.reset();
    });
  </script>
</body>
</html>
